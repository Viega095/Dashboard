<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Muchas Gracias! - Hub Personal Dashboard</title>
    <meta name="description" content="Mensaje de confirmación y agradecimiento del Hub Personal Dashboard.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <style>
        .thanks-container {
            max-width: 580px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            text-align: center;
            border-radius: var(--card-radius);
            color: var(--text-main);
        }
        .thanks-icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #10b981;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="bg-overlay"></div>
    <div class="thanks-container glass-effect">
        <div class="thanks-icon-circle">
            <i class="ph-fill ph-check-circle"></i>
        </div>
        <h1 style="font-size:2rem; margin-bottom:0.75rem; color:#fff;">¡Muchas Gracias!</h1>
        <p style="font-size:1.05rem; color:var(--text-muted); line-height:1.6; margin-bottom:2rem;" id="thanks-message">
            Hemos recibido tu mensaje correctamente. Te responderemos al correo provisto a la brevedad. Gracias por ser parte de nuestra comunidad.
        </p>
        <div style="display:flex; justify-content:center; gap:1rem;">
            <a href="index.html" class="btn-primary" style="text-decoration:none; padding:0.8rem 1.8rem;">
                <i class="ph ph-house"></i> Volver al Dashboard
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const from = params.get('from');
        if (name && from === 'contact') {
            document.getElementById('thanks-message').textContent = `¡Hola ${name}! Tu mensaje fue registrado con éxito. Te responderemos cuanto antes.`;
        }
    </script>
</body>
</html>
